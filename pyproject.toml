[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-regression-cli"
version = "0.1.0"
description = "Engineering-lite prompt regression harness: versioned prompt variants, fixed YAML test cases, OpenAI-compatible endpoints (incl. Ollama), rubric/exact scoring, and git-friendly pass/fail reports."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Asdale Dynamics, LLC" }]
keywords = ["prompts", "llm", "ollama", "testing", "regression"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
prompt-regression = "prompt_regression_cli.cli:main"

[tool.setuptools]
packages = ["prompt_regression_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
